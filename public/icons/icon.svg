<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="I Really Know">
  <!-- The Marked Script: your own page, with an examiner's pen in the margin.
       Paper and ink only. No gradient, no mascot, no confetti. The one green
       span is the whole product: the part you actually own. -->
  <rect width="512" height="512" rx="112" fill="#F5F2EA"/>
  <rect x="0.5" y="0.5" width="511" height="511" rx="111.5" fill="none" stroke="#DCD5C7" stroke-width="1"/>

  <!-- margin rule, as on a marked script -->
  <rect x="150" y="88" width="2" height="336" fill="#E0D9CA"/>

  <!-- the submission -->
  <g fill="#B9B2A4">
    <rect x="186" y="130" width="206" height="16" rx="8"/>
    <rect x="186" y="182" width="246" height="16" rx="8"/>
    <rect x="186" y="286" width="180" height="16" rx="8"/>
    <rect x="186" y="338" width="228" height="16" rx="8"/>
    <rect x="186" y="390" width="140" height="16" rx="8"/>
  </g>

  <!-- the examined span: ownership wash, darker ink, underline -->
  <rect x="176" y="220" width="272" height="44" rx="10" fill="#CBE0CB"/>
  <rect x="186" y="234" width="252" height="16" rx="8" fill="#4F5C4D"/>
  <rect x="176" y="259" width="272" height="5" rx="2.5" fill="#2E7D4F"/>

  <!-- the examiner's tick, in the margin, aligned to the marked line -->
  <g transform="rotate(-4 112 250)">
    <path d="M62 246 L106 292 L170 166" fill="none" stroke="#1A1A18" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M156 190 L172 160" fill="none" stroke="#1A1A18" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
