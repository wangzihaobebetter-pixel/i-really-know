<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F2EA" />
    <meta name="description" content="I Really Know — a learning verification tool. Submit your own finished work and find out how much of it you actually understand." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="I Really Know" />
    <title>I Really Know · 我真会</title>
    <script>
      /* Pre-paint theme + language so the first frame is already correct (§7.2). */
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem('irk-ui') || '{}');
          var theme = ui.theme || 'system';
          var resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'slate' : 'paper')
            : theme;
          document.documentElement.dataset.theme = resolved;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', resolved === 'slate' ? '#141518' : '#F5F2EA');
          var lang = ui.language && ui.language !== 'auto' ? ui.language : (navigator.language || 'en');
          document.documentElement.lang = lang.toLowerCase().indexOf('zh') === 0 ? 'zh-CN' : 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
